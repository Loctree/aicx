name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Hosted runners only: org self-hosted runners are not exposed to
          # private repositories since the 2026-08 miner incident.
          - name: linux
            runner: '"ubuntu-latest"'
          - name: macos
            runner: '"macos-15"'
          - name: windows-latest
            runner: '"windows-latest"'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: aicx

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: runner.os == 'Linux'
        with:
          python-version: '3.x'

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07
        with:
          components: clippy, rustfmt

      - name: semgrep
        if: runner.os == 'Linux'
        working-directory: aicx
        run: |
          python -m pip install --upgrade pip semgrep
          semgrep --config auto --error --quiet

      - name: cargo check
        working-directory: aicx
        run: cargo check --locked

      # Mirrors `make loctree-consumer-check` (raw cargo so windows-latest
      # does not depend on GNU make): the slim library profile consumed by
      # Loctree must build, pass its contract test, and stay free of
      # lancedb/llama dependencies.
      - name: loctree-consumer-check
        working-directory: aicx
        shell: bash
        run: |
          cargo check --locked -p aicx --no-default-features --features loctree-consumer
          cargo test --locked -p aicx --lib --no-default-features --features loctree-consumer slim_profile_exposes_read_core_contract
          hits=$(cargo tree --locked --no-default-features --features loctree-consumer -p aicx | grep -ciE 'lancedb|llama' || true)
          if [ "$hits" != "0" ]; then
            echo "loctree-consumer pulled forbidden lancedb/llama dependencies ($hits hits)" >&2
            exit 1
          fi

      - name: cargo clippy default
        working-directory: aicx
        run: cargo clippy --locked -p aicx --all-targets -- -D warnings

      - name: cargo clippy native GGUF
        working-directory: aicx
        run: |
          cargo clippy --locked -p aicx-embeddings --features gguf -- -D warnings
          cargo clippy --locked -p aicx --features native-embedder --all-targets -- -D warnings

      - name: cargo test
        working-directory: aicx
        # Keep serialized until remaining AICX_HOME-mutating tests share one
        # root-crate lock or move to explicit-home helpers (Wave F).
        run: cargo test --locked --all-targets --no-fail-fast -- --test-threads=2

      - name: cargo test native GGUF
        working-directory: aicx
        run: |
          cargo test --locked -p aicx-embeddings --features gguf
          cargo test --locked -p aicx --features native-embedder --test native_embedder

      - name: cargo fmt
        working-directory: aicx
        run: cargo fmt -- --check
