# Oracle assertion manifest — W0-T2 freeze.
# Idiom matches contract/*.toml: schema + array of tables, one row per check.
# W4-T15 is the runner. This file describes production extract output;
# it does not invent parser fields (anti-N13).
#
# kind: presence | absence | count | seal
# status: baseline | hypothesis | expected_fail_until_W2-T7 | expected_fail_until_W2-T12 | expected_fail_until_W2-T13
# Count rows carry baseline_from = engine SHA that produced expected.
# UserMsg = rendered markdown headings matching `**[HH:MM:SS] user:**`.

schema = "aicx.parser.oracle_assertions.v1"
baseline_engine = "aicx@a687754"

