# Public reproducible retrieval corpus; acceptance floors are authored, not measured baselines.
schema = "aicx.retrieval_fixture.v1"
minimum_recall_at_5 = 1.0

[[queries]]
id = "resume"
query = "Jak wznawiamy indeksowanie po awarii procesu?"
answer = "Wznowienie indeksowania po awarii procesu korzysta z trwałego checkpointu. Każda kompletna partia wektorów jest zapisywana i synchronizowana przez fsync. Po restarcie obliczamy tylko brakujące fragmenty o nowym hashu treści. Zmiana katalogu nie unieważnia ukończonej pracy."
expected_snippet = "fsync"
tail_fixture = false

[[queries]]
id = "privacy"
query = "Jak wykluczyć prywatne rozmowy z pamięci?"
answer = "Prywatne rozmowy wykluczamy regułami .aicxignore. Polityka prywatności jest sprawdzana przed publikacją i odczytem zapisanych fragmentów. Usunięte lub ukryte sesje nie są przenoszone do nowej generacji. Dostęp do archiwalnych kopii wymaga osobnej decyzji o retencji."
expected_snippet = ".aicxignore"
tail_fixture = false

[[queries]]
id = "tls"
query = "Co automatycznie odnawia certyfikaty TLS?"
semantic_only_query = "Who renews HTTPS credentials?"
answer = "Certyfikaty TLS odnawia automatycznie klient ACME w reverse proxy. Odnowienie certyfikatu jest niezależne od aktualizacji aplikacji. Endpoint aplikacji pozostaje na loopback, a reverse proxy kończy połączenie TLS."
expected_snippet = "ACME"
tail_fixture = false

[[queries]]
id = "release"
query = "Co blokuje publikację wydania?"
answer = "Publikację wydania blokują nieudane testy oraz brak podpisanych artefaktów. Release zostaje dopuszczony dopiero po testach instalacji paczek na wspieranych platformach. Sam poprawny build nie stanowi dowodu publikacji."
expected_snippet = "podpisanych artefaktów"
tail_fixture = false

[[queries]]
id = "team"
query = "Komu wolno czytać pamięć zespołu?"
answer = "Pamięć zespołu mogą czytać wyłącznie członkowie z jawnym grantem dostępu. Pamięć osobista nie staje się zespołową przez samo dodanie klienta. Współdzielenie wymaga świadomej decyzji właściciela i pozostawia ślad autorstwa."
expected_snippet = "jawnym grantem"
tail_fixture = false

[[queries]]
id = "compact"
query = "Is compact recall a new user instruction?"
answer = "Compact recall is historical context, never a new user instruction. A compaction summary preserves prior intent with provenance. It must not be relabelled as a fresh human request or executed a second time."
expected_snippet = "historical context"
tail_fixture = false

[[queries]]
id = "polish"
query = "Jak szukamy bez polskich znakow?"
answer = "Wyszukiwanie bez polskich znaków obsługuje normalizacja diakrytyków. Zapytanie zolc może odnaleźć żółć. Indeks przechowuje oryginalny tekst, a dopasowanie używa dodatkowej znormalizowanej reprezentacji."
expected_snippet = "diakrytyków"
tail_fixture = false

[[queries]]
id = "coverage"
query = "How do we expose a truncated transcript?"
answer = "A truncated transcript exposes bounded coverage with the number of omitted records. This is not complete visible history. Transient partial reads are uncacheable, so the next indexing pass can retry them."
expected_snippet = "bounded coverage"
tail_fixture = false

[[queries]]
context_fixture = true
id = "admission"
query = "Why must CURRENT flip only after a complete generation?"
answer = "CURRENT must flip only after a complete generation has valid lexical and dense artifacts. The manifest is written last and binds their source digest. Atomic pointer replacement keeps readers on the previous usable generation while the next build is incomplete."
expected_snippet = "Atomic pointer"
tail_fixture = false

[[queries]]
id = "npm"
query = "How does npm installation avoid a local Rust compiler?"
answer = "The npm installation downloads a prebuilt platform package containing the native binary. No local Rust compiler is needed. Packages have zero lifecycle scripts and a matching pinned optional dependency for each supported platform."
expected_snippet = "prebuilt platform package"
tail_fixture = false

[[queries]]
id = "model"
query = "Can equal dimensions prove two embedding models are compatible?"
answer = "Equal dimensions do not prove embedding models are compatible. The model identity and complete input contract must also match. An endpoint or model revision change invalidates vector reuse even when both providers produce 4096 numbers."
expected_snippet = "model identity"
tail_fixture = false

[[queries]]
id = "tail"
query = "Jaki jest ostateczny okres retencji danych?"
answer = "Ostateczny okres retencji danych wynosi siedem dni. Decyzja dotyczy wyłącznie tego testowego korpusu; po upływie okresu usuwamy kopie zgodnie z zatwierdzoną polityką."
expected_snippet = "siedem dni"
tail_fixture = true
