# Keep broad single-word markers (jak/czy/where/etc.) in markers, requiring '?'.
dictated_prefixes = [
  "co to ma być", "co to ma byc", "jak to działa", "jak to dziala", "jak to ma",
  "w jaki sposób", "w jaki sposob", "dlaczego ", "po co ",
