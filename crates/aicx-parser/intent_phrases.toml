[question]
markers = [
  "how do", "how does", "how to", "what is", "what are", "why does", "why is", "why ",
  "can we", "should we", "is it possible", "does it", "do we",
  "jak ", "dlaczego ", "czy ", "co to ", "co jest", "w jaki sposób", "w jaki sposob",
